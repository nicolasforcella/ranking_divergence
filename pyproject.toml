[project]
name = "ranking-divergence"
version = "0.1.0"
description = "LLM rank-histogram divergences and lightweight text generation metrics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=1.23.0",
    "nltk>=3.10.0",
    "numpy>=1.23",
    "torch>=2.5",
    "torchaudio>=2.11",
    "torchvision>=0.26",
    "tqdm>=4.64",
    "transformers>=5.5.3",
    "vllm>=0.24",
]

[project.optional-dependencies]
examples = [
    "datasets>=2.14",
    "evaluate>=0.4",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
# CUDA 12.9 builds: newest runtime still compatible with the driver (535 / CUDA 12.2);
# default PyPI torch/vllm are CUDA 13 builds, which the driver rejects
torch = [{ index = "pytorch-cu129" }]
torchvision = [{ index = "pytorch-cu129" }]
torchaudio = [{ index = "pytorch-cu129" }]
vllm = { url = "https://github.com/vllm-project/vllm/releases/download/v0.25.1/vllm-0.25.1+cu129-cp38-abi3-manylinux_2_28_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
